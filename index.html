<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FinFlow — Gestão Financeira Pessoal</title><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--primary:#5b4bdb;--green:#159447;--red:#d33b45;--line:#e8eaf0}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:var(--text)}header{background:#fff;border-bottom:1px solid var(--line);padding:16px;position:sticky;top:0;z-index:3}.brand{font-size:23px;font-weight:800;color:var(--primary)}nav{display:flex;gap:7px;overflow:auto;margin-top:12px}nav button,.month button{border:0;background:#f0effd;color:#4035a9;padding:10px 13px;border-radius:10px;white-space:nowrap;font-weight:700}.active{background:var(--primary)!important;color:#fff!important}main{max-width:1150px;margin:auto;padding:18px}.month{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.month button{background:#fff;border:1px solid var(--line)}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:15px}.card{padding:16px}.label,.small{color:var(--muted);font-size:13px}.value{font-size:22px;font-weight:800;margin-top:7px}.green{color:var(--green)}.red{color:var(--red)}.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-top:16px}.panel{padding:18px;margin-top:16px}.grid .panel{margin-top:0}.panel h3{margin-top:0}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}form{display:grid;gap:10px}input,select,textarea{padding:11px;border:1px solid #dfe2ea;border-radius:9px;width:100%;background:#fff}button.primary{background:var(--primary);color:white;border:0;padding:11px 15px;border-radius:10px;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none}.pill{display:inline-block;padding:3px 7px;border-radius:99px;background:#eee;font-size:11px}.table{overflow:auto}.bar{height:10px;background:#eee;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--primary)}.yeargrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.monthbox{padding:14px;border:1px solid var(--line);border-radius:12px}.monthbox strong{display:block;margin-bottom:8px}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.yeargrid{grid-template-columns:1fr}.card:last-child{grid-column:1/-1}}
</style></head><body><header><div class="brand">FinFlow <span style="font-size:12px;color:#777">MVP 2.0</span></div><nav id="nav"></nav></header><main><div id="app"></div></main><script>
const KEY='finflow_data_v2';let db=JSON.parse(localStorage.getItem(KEY)||'null')||{entries:[],debts:[]};let cursor=new Date();cursor.setDate(1);let view='dashboard';const labels={income:'Receita',expense:'Despesa',investment:'Investimento'};const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const ym=d=>d.toISOString().slice(0,7);const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function save(){localStorage.setItem(KEY,JSON.stringify(db))}function monthLabel(d){return new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(d)}
function debtEntries(d){let out=[];db.debts.forEach(x=>{let start=new Date(x.start+'T12:00:00');for(let i=0;i<x.installments;i++){let dt=new Date(start);dt.setMonth(dt.getMonth()+i);let date=dt.toISOString().slice(0,10);out.push({id:x.id+'-'+i,type:'debt',desc:x.name,amount:x.installment,date,category:'Parcela '+(i+1)+'/'+x.installments,auto:true,debtId:x.id,n:i+1})}});return out}function allEntries(){return [...db.entries,...debtEntries()]}
function sums(items){let s={income:0,expense:0,debt:0,investment:0};items.forEach(x=>s[x.type]=(s[x.type]||0)+Number(x.amount));return s}
function renderNav(){document.getElementById('nav').innerHTML=[['dashboard','Visão geral'],['entries','Lançamentos'],['debts','Dívidas'],['annual','Visão anual']].map(([v,t])=>`<button class="${view==v?'active':''}" onclick="view='${v}';render()">${t}</button>`).join('')}
function dashboard(){let m=ym(cursor),items=allEntries().filter(x=>x.date.slice(0,7)==m),s=sums(items),saldo=s.income-s.expense-s.debt-s.investment;let year=cursor.getFullYear();let months=Array.from({length:12},(_,i)=>{let mi=String(i+1).padStart(2,'0'),it=allEntries().filter(x=>x.date.startsWith(year+'-'+mi));let z=sums(it);return {name:new Intl.DateTimeFormat('pt-BR',{month:'short'}).format(new Date(year,i,1)).replace('.',''),saldo:z.income-z.expense-z.debt-z.investment}});return `<div class="month"><button onclick="cursor.setMonth(cursor.getMonth()-1);render()">‹</button><h2>${monthLabel(cursor)}</h2><button onclick="cursor.setMonth(cursor.getMonth()+1);render()">›</button></div><section class="cards">${[['Receitas',s.income,'green'],['Despesas',s.expense,'red'],['Dívidas',s.debt,'red'],['Investimentos',s.investment,'green'],['Saldo',saldo,saldo>=0?'green':'red']].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value ${x[2]}">${money(x[1])}</div></div>`).join('')}</section><div class="grid"><section class="panel"><h3>Saúde financeira</h3><div class="row"><span>Receitas</span><b class="green">${money(s.income)}</b></div><div class="row"><span>Despesas + dívidas</span><b>${money(s.expense+s.debt)}</b></div><div class="row"><span>Investimentos</span><b>${money(s.investment)}</b></div><div class="row"><span>Comprometimento da renda</span><b>${s.income?Math.round((s.expense+s.debt)/s.income*100):0}%</b></div></section><section class="panel"><h3>Resumo anual ${year}</h3>${months.map(x=>`<div class="row"><span>${x.name}</span><b class="${x.saldo>=0?'green':'red'}">${money(x.saldo)}</b></div>`).join('')}</section></div><section class="panel"><h3>Próximas parcelas</h3>${debtEntries(new Date()).filter(x=>x.date>=new Date().toISOString().slice(0,10)).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6).map(x=>`<div class="row"><span><b>${x.date.split('-').reverse().join('/')}</b> · ${esc(x.desc)}<br><span class="small">${x.category}</span></span><b class="red">${money(x.amount)}</b></div>`).join('')||'<p class="small">Nenhuma parcela cadastrada.</p>'}</section>`}
function entries(){let m=ym(cursor),items=allEntries().filter(x=>x.date.startsWith(m)).sort((a,b)=>a.date.localeCompare(b.date));return `<div class="month"><button onclick="cursor.setMonth(cursor.getMonth()-1);render()">‹</button><h2>${monthLabel(cursor)}</h2><button onclick="cursor.setMonth(cursor.getMonth()+1);render()">›</button></div><section class="grid"><section class="panel"><h3>Novo lançamento</h3><form onsubmit="addEntry(event)"><select id="etype"><option value="income">Receita</option><option value="expense">Despesa</option><option value="investment">Investimento</option></select><input id="edesc" placeholder="Descrição" required><input id="eamount" type="number" step=".01" placeholder="Valor" required><input id="edate" type="date" value="${new Date().toISOString().slice(0,10)}" required><input id="ecat" placeholder="Categoria"><button class="primary">Salvar</button></form></section><section class="panel"><h3>Calendário financeiro</h3><p class="small">Todos os lançamentos e parcelas automáticas do mês aparecem abaixo.</p></section></section><section class="panel"><h3>Lançamentos de ${monthLabel(cursor)}</h3>${items.length?items.map(x=>`<div class="row"><span><b>${x.date.split('-').reverse().join('/')}</b> · ${labels[x.type]||'Dívida'} · ${esc(x.desc)}<br><span class="small">${esc(x.category)}</span></span><span><b>${money(x.amount)}</b>${x.auto?'':'<br><button onclick="delEntry(\''+x.id+'\')">Excluir</button>'}</span></div>`).join(''):'<p class="small">Nenhum lançamento.</p>'}</section>`}
function debts(){return `<section class="panel"><h3>🔴 Dívidas inteligentes</h3><p class="small">Cadastre uma dívida uma vez. O FinFlow gera automaticamente cada parcela no mês correto.</p><form onsubmit="addDebt(event)"><input id="dname" placeholder="Ex.: Cartão / Financiamento" required><input id="dtotal" type="number" step=".01" placeholder="Valor total" required><input id="dinst" type="number" step=".01" placeholder="Valor da parcela" required><input id="dqty" type="number" min="1" placeholder="Número de parcelas" required><label class="small">Primeiro vencimento</label><input id="dstart" type="date" required><button class="primary">Cadastrar dívida</button></form></section><section class="panel"><h3>Minhas dívidas</h3>${db.debts.length?db.debts.map(d=>{let now=new Date(),start=new Date(d.start+'T12:00:00');let passed=(now.getFullYear()-start.getFullYear())*12+now.getMonth()-start.getMonth();let paid=Math.min(Math.max(passed+1,0),d.installments);return `<div class="row"><span><b>${esc(d.name)}</b><br><span class="small">${money(d.total)} · ${money(d.installment)} × ${d.installments}<br>Início: ${d.start.split('-').reverse().join('/')} · Fim: ${d.end.split('-').reverse().join('/')}</span><div class="bar"><i style="width:${paid/d.installments*100}%"></i></div><span class="small">${paid}/${d.installments} parcelas estimadas</span></span><button onclick="delDebt('${d.id}')">Excluir</button></div>`}).join(''):'<p class="small">Nenhuma dívida cadastrada.</p>'}</section>`}
function annual(){let y=cursor.getFullYear(),rows=Array.from({length:12},(_,i)=>{let m=String(i+1).padStart(2,'0'),it=allEntries().filter(x=>x.date.startsWith(y+'-'+m)),s=sums(it);return {m:new Intl.DateTimeFormat('pt-BR',{month:'long'}).format(new Date(y,i,1)),...s,saldo:s.income-s.expense-s.debt-s.investment}}),tot=sums(allEntries().filter(x=>x.date.startsWith(y+'-')));return `<div class="month"><button onclick="cursor.setFullYear(y-1);render()">‹</button><h2>${y}</h2><button onclick="cursor.setFullYear(y+1);render()">›</button></div><section class="cards">${[['Receitas',tot.income,'green'],['Despesas',tot.expense,'red'],['Dívidas',tot.debt,'red'],['Investimentos',tot.investment,'green'],['Saldo',tot.income-tot.expense-tot.debt-tot.investment,'green']].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value ${x[2]}">${money(x[1])}</div></div>`).join('')}</section><section class="panel"><h3>Fechamento mês a mês</h3><div class="yeargrid">${rows.map(r=>`<div class="monthbox"><strong>${r.m}</strong><div class="small">Receitas</div><b class="green">${money(r.income)}</b><div class="small">Saídas</div><b>${money(r.expense+r.debt+r.investment)}</b><div class="small">Saldo</div><b class="${r.saldo>=0?'green':'red'}">${money(r.saldo)}</b></div>`).join('')}</div></section>`}
function addEntry(e){e.preventDefault();db.entries.push({id:Date.now().toString(),type:etype.value,desc:edesc.value,amount:+eamount.value,date:edate.value,category:ecat.value});save();render()}function delEntry(id){db.entries=db.entries.filter(x=>x.id!==id);save();render()}function addDebt(e){e.preventDefault();let start=dstart.value,s=new Date(start+'T12:00:00'),end=new Date(s);end.setMonth(end.getMonth()+Number(dqty.value)-1);db.debts.push({id:Date.now().toString(),name:dname.value,total:+dtotal.value,installment:+dinst.value,installments:+dqty.value,start,end:end.toISOString().slice(0,10)});save();render()}function delDebt(id){db.debts=db.debts.filter(x=>x.id!==id);save();render()}
function render(){renderNav();document.getElementById('app').innerHTML=view==='dashboard'?dashboard():view==='entries'?entries():view==='debts'?debts():annual()}render();
</script></body></html>
