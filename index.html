<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#151827"><title>FinFlow — Gestão Financeira Pessoal</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#151827;--muted:#73798a;--primary:#5b4bdb;--primary2:#7869ee;--green:#14945a;--red:#dc4652;--orange:#d88718;--blue:#3276d8;--line:#e7e9f0;--shadow:0 10px 30px rgba(26,31,55,.07)}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.topin{max-width:1180px;margin:auto;padding:15px 18px 12px}.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:24px;font-weight:900;letter-spacing:-.7px}.brand b{color:var(--primary)}.version{font-size:11px;color:var(--muted);font-weight:700;background:#f0effd;padding:4px 7px;border-radius:99px}.nav{display:flex;gap:7px;overflow:auto;margin-top:13px;padding-bottom:2px}.nav button{border:0;background:#f5f5fa;color:#505567;padding:9px 13px;border-radius:10px;white-space:nowrap;font-weight:800}.nav button.active{background:var(--primary);color:#fff;box-shadow:0 5px 14px rgba(91,75,219,.22)}main{max-width:1180px;margin:auto;padding:22px 18px 45px}.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.monthbar h1{font-size:22px;margin:0;text-transform:capitalize}.monthbar .sub{font-size:12px;color:var(--muted);margin-top:3px}.iconbtn{border:1px solid var(--line);background:#fff;width:38px;height:38px;border-radius:11px;font-size:20px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}.card .label{color:var(--muted);font-size:12px;font-weight:700}.card .value{font-size:21px;font-weight:900;margin-top:7px;letter-spacing:-.4px}.green{color:var(--green)!important}.red{color:var(--red)!important}.blue{color:var(--blue)!important}.orange{color:var(--orange)!important}.layout{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-top:16px}.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:var(--shadow)}.panel h2,.panel h3{margin:0 0 14px}.panel h3{font-size:16px}.muted{color:var(--muted)}.small{font-size:12px;color:var(--muted)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.rowleft{min-width:0}.rowleft b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{display:inline-flex;align-items:center;padding:4px 8px;border-radius:99px;background:#f1f2f6;color:#626879;font-size:11px;font-weight:800;margin-top:4px}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:10px;font-weight:800;color:#454a5b}.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn.danger{color:var(--red)}.btn.sm{padding:6px 8px;font-size:11px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:11px;color:var(--muted);font-weight:800;margin:0 0 5px}.field.full{grid-column:1/-1}input,select,textarea{border:1px solid #dfe2ea;background:#fff;border-radius:10px;padding:11px 12px;outline:none;width:100%;color:var(--text)}input:focus,select:focus,textarea:focus{border-color:#9c92ee;box-shadow:0 0 0 3px rgba(91,75,219,.09)}textarea{min-height:76px;resize:vertical}.formactions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}.notice{padding:12px;border-radius:12px;background:#f5f4ff;border:1px solid #e3e0ff;color:#5147aa;font-size:12px;font-weight:700}.chart{width:100%;height:235px;display:block}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:5px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}.barline{display:grid;grid-template-columns:90px 1fr 80px;align-items:center;gap:9px;margin:10px 0}.track{height:9px;background:#eef0f5;border-radius:99px;overflow:hidden}.fill{height:100%;border-radius:99px;background:var(--primary)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.calhead{font-size:10px;color:var(--muted);text-align:center;font-weight:900;padding:4px}.day{min-height:73px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:7px;position:relative}.day.mutedday{opacity:.4}.day.today{border-color:#8d82eb;box-shadow:inset 0 0 0 1px #8d82eb}.daynum{font-size:11px;font-weight:900}.event{font-size:9px;border-radius:5px;padding:2px 4px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#f0effd;color:#5147aa}.event.exp{background:#fff0f1;color:#bd3541}.event.inv{background:#eaf7ef;color:#137a4b}.event.debt{background:#fff5e6;color:#a6650d}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.debtcard{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}.progress{height:8px;background:#eef0f5;border-radius:99px;overflow:hidden;margin:10px 0 5px}.progress i{display:block;height:100%;background:var(--primary);border-radius:99px}.debtmeta{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted)}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.statbox{padding:13px;border:1px solid var(--line);border-radius:13px}.statbox .big{font-size:18px;font-weight:900;margin-top:5px}.empty{text-align:center;padding:28px 10px;color:var(--muted);font-size:13px}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:14px}.tabs button{border:1px solid var(--line);background:#fff;padding:8px 11px;border-radius:9px;font-size:12px;font-weight:800}.tabs button.on{background:#efedff;border-color:#dcd8ff;color:#5147aa}.modal{position:fixed;inset:0;background:rgba(13,17,31,.46);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}.modalbox{width:min(620px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:19px;box-shadow:0 30px 80px rgba(0,0,0,.25)}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.close{border:0;background:#f2f3f7;width:34px;height:34px;border-radius:9px}.hidden{display:none!important}.footer{color:var(--muted);font-size:11px;text-align:center;margin-top:25px}.yeartotals{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px}.selectmonth{min-width:145px}.budget{margin-top:10px}.budgettop{display:flex;justify-content:space-between;font-size:12px;font-weight:800}.warning{color:var(--red)}.success{color:var(--green)}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.cards .card:last-child{grid-column:1/-1}.layout{grid-template-columns:1fr}.yeartotals{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){main{padding:16px 12px 35px}.topin{padding:13px 12px 10px}.brand{font-size:21px}.cards{gap:8px}.card{padding:13px}.card .value{font-size:18px}.formgrid{grid-template-columns:1fr}.field.full,.formactions{grid-column:auto}.calendar{gap:3px}.day{min-height:58px;padding:5px}.event{font-size:8px}.barline{grid-template-columns:75px 1fr 67px}.grid3{grid-template-columns:1fr}.monthbar h1{font-size:19px}}
.heroDash{background:linear-gradient(135deg,#171a2c,#2e2a63);color:#fff;border-radius:22px;padding:22px;display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:16px;box-shadow:0 18px 40px rgba(31,27,73,.18)}.heroDash h2{margin:5px 0;font-size:28px;letter-spacing:-.8px}.heroDash p{margin:0;color:#d8d9e7;font-size:13px;max-width:620px}.eyebrow{font-size:10px;letter-spacing:1.5px;font-weight:900;opacity:.65}.forecastBox{min-width:220px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);padding:15px;border-radius:16px}.forecastBox span,.forecastBox small{display:block;color:#cdd0df;font-size:11px}.forecastBox strong{display:block;font-size:27px;margin:4px 0}.forecastBox .progress{background:rgba(255,255,255,.18)}.forecastBox .progress i{background:#fff}.alert{border:1px solid var(--line);border-left:4px solid var(--primary);background:#fafaff;border-radius:11px;padding:11px 12px;margin-bottom:9px;font-size:12px}.alert b{display:block;margin-bottom:3px}.alert.danger{border-left-color:var(--red);background:#fff7f8}.alert.warning{border-left-color:var(--orange);background:#fffaf2}.alert.success{border-left-color:var(--green);background:#f4fbf7}@media(max-width:700px){.heroDash{display:block}.forecastBox{margin-top:15px}.heroDash h2{font-size:23px}}</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brandrow"><div class="brand"><b>Fin</b>Flow <span class="version">MVP 3.0</span></div><button class="btn" onclick="exportData()">Exportar</button></div><nav class="nav" id="nav"></nav></div></header>
<main><div id="app"></div><div class="footer">FinFlow • seus dados ficam salvos neste navegador nesta versão.</div></main><div id="modal" class="hidden"></div>
<script>
const KEY='finflow_data_v3';
const defaultDB={entries:[],debts:[],budgets:{},assets:[],goals:[]};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||defaultDB;db.entries=db.entries||[];db.debts=db.debts||[];db.budgets=db.budgets||{};db.assets=db.assets||[];db.goals=db.goals||[];
let cursor=new Date();cursor.setDate(1);let view='dashboard';let editingId=null;let editingGoalId=null;
const categories={income:['Salário','Freelance','Uber/99','Vendas','Benefícios','Aluguéis recebidos','Outras receitas'],expense:['Moradia','Alimentação','Transporte','Contas','Família','Compras','Lazer','Assinaturas','Saúde','Educação','Impostos','Outras despesas'],investment:['Reserva de emergência','Tesouro Direto','CDB','Ações','Fundos','Criptomoedas','Previdência','Outros investimentos']};
const labels={income:'Receita',expense:'Despesa',investment:'Investimento',debt:'Dívida'};
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dateBR=s=>s?s.split('-').reverse().join('/'):'—';const ym=d=>d.toISOString().slice(0,7);const monthLabel=d=>new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(d);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function debtEntries(){let out=[];db.debts.forEach(x=>{let start=new Date(x.start+'T12:00:00');for(let i=0;i<x.installments;i++){let dt=new Date(start);dt.setMonth(dt.getMonth()+i);let date=dt.toISOString().slice(0,10);out.push({id:x.id+'-'+i,type:'debt',desc:x.name,amount:x.installment,date,category:'Parcela '+(i+1)+'/'+x.installments,auto:true,debtId:x.id,n:i+1,totalInstallments:x.installments})}});return out}
function allEntries(){return [...db.entries,...debtEntries()]}
function sums(items){let s={income:0,expense:0,debt:0,investment:0};items.forEach(x=>s[x.type]=(s[x.type]||0)+Number(x.amount||0));return s}
function nav(){let arr=[['dashboard','Visão geral'],['entries','Lançamentos'],['debts','Dívidas'],['budgets','Orçamentos'],['assets','Patrimônio'],['goals','Metas'],['annual','Visão anual'],['alerts','🔔 Alertas']];document.getElementById('nav').innerHTML=arr.map(([v,t])=>`<button class="${view===v?'active':''}" onclick="view='${v}';render()">${t}</button>`).join('')}
function monthBar(){return `<div class="monthbar"><button class="iconbtn" onclick="cursor.setMonth(cursor.getMonth()-1);render()">‹</button><div style="text-align:center"><h1>${monthLabel(cursor)}</h1><div class="sub">Visão financeira do mês selecionado</div></div><button class="iconbtn" onclick="cursor.setMonth(cursor.getMonth()+1);render()">›</button></div>`}
function cards(s){let saldo=s.income-s.expense-s.debt-s.investment;return `<section class="cards">${[['Receitas',s.income,'green'],['Despesas',s.expense,'red'],['Dívidas',s.debt,'red'],['Investimentos',s.investment,'green'],['Saldo disponível',saldo,saldo>=0?'green':'red']].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value ${x[2]}">${money(x[1])}</div></div>`).join('')}</section>`}
function chartBars(data,max){let h=190,w=700,left=42,bottom=28,top=12,barW=Math.max(8,(w-left-10)/data.length-9),scale=(h-top-bottom)/(max||1);let bars=data.map((d,i)=>{let bh=d.v*scale;let x=left+i*((w-left)/data.length)+5;let y=h-bottom-bh;return `<rect x="${x}" y="${y}" width="${barW}" height="${Math.max(1,bh)}" rx="4" fill="currentColor" opacity=".85"><title>${esc(d.label)}: ${money(d.v)}</title></rect><text x="${x+barW/2}" y="${h-9}" text-anchor="middle" font-size="10" fill="currentColor" opacity=".65">${esc(d.short)}</text>`}).join('');return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line x1="${left}" y1="${top}" x2="${left}" y2="${h-bottom}" stroke="#e6e8ef"/><line x1="${left}" y1="${h-bottom}" x2="${w}" y2="${h-bottom}" stroke="#e6e8ef"/><g>${bars}</g></svg>`}
function todayISO(){return new Date().toISOString().slice(0,10)}
function monthBounds(m){let [y,mo]=m.split('-').map(Number);return {start:`${m}-01`,end:new Date(y,mo,0).toISOString().slice(0,10)}}
function plannedFutureForMonth(m){return allEntries().filter(x=>x.date.startsWith(m))}
function currentMonthForecast(m){let b=monthBounds(m),all=allEntries().filter(x=>x.date.startsWith(m)),now=todayISO();let actual=all.filter(x=>x.date<=now),future=all.filter(x=>x.date>now);let a=sums(actual),f=sums(future);return {actual:a,future:f,total:sums(all),saldoAtual:a.income-a.expense-a.debt-a.investment,saldoPrevisto:(a.income+f.income)-(a.expense+f.expense+a.debt+f.debt+a.investment+f.investment)}}
function upcomingBills(m){let now=todayISO();return allEntries().filter(x=>x.date>=now&&x.date.startsWith(m)&&x.type!=='income').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,8)}
function alertData(m){let out=[],f=currentMonthForecast(m),today=todayISO();let budgets=db.budgets||{};categories.expense.forEach(c=>{let spent=allEntries().filter(x=>x.date.startsWith(m)&&x.type==='expense'&&x.category===c).reduce((a,x)=>a+Number(x.amount),0),limit=Number(budgets[m+'|'+c]||0);if(limit&&spent>limit)out.push({level:'danger',title:'Orçamento ultrapassado',text:`${c}: ${money(spent)} de ${money(limit)}.`});else if(limit&&spent>=limit*.8)out.push({level:'warning',title:'Orçamento chegando ao limite',text:`${c}: ${Math.round(spent/limit*100)}% utilizado.`})});if(f.saldoPrevisto<0)out.push({level:'danger',title:'Saldo previsto negativo',text:`A previsão de fechamento é ${money(f.saldoPrevisto)}.`});else if(f.saldoPrevisto>0)out.push({level:'success',title:'Saldo previsto positivo',text:`A previsão de fechamento é ${money(f.saldoPrevisto)}.`});let next=upcomingBills(m)[0];if(next){let days=Math.ceil((new Date(next.date+'T12:00:00')-new Date(today+'T12:00:00'))/86400000);if(days<=3)out.push({level:'warning',title:'Conta próxima do vencimento',text:`${next.desc} vence em ${days<=0?'hoje':days+' dia(s)'} — ${money(next.amount)}.`})}return out}
function dashboard(){let m=ym(cursor),f=currentMonthForecast(m),s=f.total,year=cursor.getFullYear(),today=todayISO(),alerts=alertData(m);let daysInMonth=new Date(cursor.getFullYear(),cursor.getMonth()+1,0).getDate(),dayNow=(new Date().getFullYear()===cursor.getFullYear()&&new Date().getMonth()===cursor.getMonth())?new Date().getDate():daysInMonth;let progress=daysInMonth?Math.min(dayNow/daysInMonth*100,100):0;let goals=db.goals.filter(g=>g.type==='saving');let goalHtml=goals.length?goals.slice(0,3).map(g=>{let pct=Math.min(Number(g.current)/Number(g.target)*100,100);return `<div class="budget"><div class="budgettop"><span>${esc(g.name)}</span><span>${money(g.current)} / ${money(g.target)}</span></div><div class="progress"><i style="width:${pct}%"></i></div><div class="small">${Math.round(pct)}% concluído</div></div>`}).join(''):'<div class="empty">Crie uma meta para acompanhar sua evolução.</div>';let bills=upcomingBills(m);let months=Array.from({length:12},(_,i)=>{let mm=String(i+1).padStart(2,'0'),z=sums(allEntries().filter(x=>x.date.startsWith(year+'-'+mm)));return {v:z.income, label:new Intl.DateTimeFormat('pt-BR',{month:'long'}).format(new Date(year,i,1)),short:new Intl.DateTimeFormat('pt-BR',{month:'short'}).format(new Date(year,i,1)).replace('.','')};});let max=Math.max(...months.map(x=>x.v),1);let expenseCats=categories.expense.map(c=>({c,v:allEntries().filter(x=>x.date.startsWith(m)&&x.type==='expense'&&x.category===c).reduce((a,x)=>a+Number(x.amount),0)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,6);let maxCat=Math.max(...expenseCats.map(x=>x.v),1);let commitment=s.income?Math.round((s.expense+s.debt)/s.income*100):0;return monthBar()+`<section class="heroDash"><div><div class="eyebrow">PAINEL FINANCEIRO</div><h2>Seu dinheiro, sob controle.</h2><p>Veja o que já aconteceu, o que ainda vai vencer e onde seu mês deve terminar.</p></div><div class="forecastBox"><span>Saldo previsto</span><strong class="${f.saldoPrevisto>=0?'green':'red'}">${money(f.saldoPrevisto)}</strong><small>${progress.toFixed(0)}% do mês percorrido</small><div class="progress"><i style="width:${progress}%"></i></div></div></section><div class="cards">${[['Receitas realizadas',f.actual.income,'green'],['A receber',f.future.income,'green'],['Despesas + dívidas',f.total.expense+f.total.debt,'red'],['Investimentos',f.total.investment,'blue'],['Saldo previsto',f.saldoPrevisto,f.saldoPrevisto>=0?'green':'red']].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value ${x[2]}">${money(x[1])}</div></div>`).join('')}</div><div class="layout"><section class="panel"><div class="sectionhead"><div><h3>Previsão de fechamento</h3><div class="small">Realizado + lançamentos futuros de ${monthLabel(cursor)}</div></div><span class="tag">${f.future.expense+f.future.debt+f.future.investment?money(f.future.expense+f.future.debt+f.future.investment)+' a sair':'Sem saídas futuras'}</span></div><div class="grid3"><div class="statbox"><div class="small">Já realizado</div><div class="big">${money(f.saldoAtual)}</div></div><div class="statbox"><div class="small">Ainda previsto</div><div class="big red">${money(f.future.expense+f.future.debt+f.future.investment-f.future.income)}</div></div><div class="statbox"><div class="small">Fechamento</div><div class="big ${f.saldoPrevisto>=0?'green':'red'}">${money(f.saldoPrevisto)}</div></div></div><div style="margin-top:16px">${chartBars(months,max)}</div></section><section class="panel"><h3>🔔 Alertas do mês</h3>${alerts.slice(0,4).map(a=>`<div class="alert ${a.level}"><b>${a.title}</b><div>${a.text}</div></div>`).join('')||'<div class="empty">Tudo tranquilo por aqui.</div>'}<button class="btn" onclick="view='alerts';render()">Ver central de alertas</button></section></div><div class="layout"><section class="panel"><h3>Contas a vencer</h3>${bills.length?bills.map(x=>`<div class="row"><div class="rowleft"><b>${dateBR(x.date)} · ${esc(x.desc)}</b><span class="tag">${esc(x.category)}</span></div><b class="red">${money(x.amount)}</b></div>`).join(''):'<div class="empty">Nenhuma conta futura cadastrada neste mês.</div>'}</section><section class="panel"><h3>Metas financeiras</h3>${goalHtml}<button class="btn primary" onclick="view='goals';render()">Gerenciar metas</button></section></div><div class="layout"><section class="panel"><h3>Despesas por categoria</h3>${expenseCats.length?expenseCats.map(x=>`<div class="barline"><span class="small">${esc(x.c)}</span><div class="track"><div class="fill" style="width:${x.v/maxCat*100}%"></div></div><b>${money(x.v)}</b></div>`).join(''):'<div class="empty">Registre despesas para ver o gráfico.</div>'}</section><section class="panel"><h3>Saúde financeira</h3><div class="row"><span>Receitas</span><b class="green">${money(s.income)}</b></div><div class="row"><span>Despesas + dívidas</span><b class="red">${money(s.expense+s.debt)}</b></div><div class="row"><span>Investimentos</span><b class="blue">${money(s.investment)}</b></div><div class="row"><span>Comprometimento</span><b class="${commitment>80?'red':commitment>60?'orange':'green'}">${commitment}%</b></div><div class="notice" style="margin-top:12px">${commitment>80?'⚠️ Sua renda está muito comprometida.':commitment>60?'🟡 Acompanhe suas saídas de perto.':'🟢 Seu comprometimento está em uma faixa confortável.'}</div></section></div>`}
function goals(){let total=db.goals.reduce((a,g)=>a+Number(g.current||0),0),target=db.goals.reduce((a,g)=>a+Number(g.target||0),0);return `<div class="monthbar"><div><h1>Metas financeiras</h1><div class="sub">Transforme intenção em acompanhamento.</div></div></div><div class="cards"><div class="card"><div class="label">Metas ativas</div><div class="value">${db.goals.length}</div></div><div class="card"><div class="label">Já reservado</div><div class="value green">${money(total)}</div></div><div class="card"><div class="label">Objetivo total</div><div class="value">${money(target)}</div></div><div class="card"><div class="label">Progresso geral</div><div class="value blue">${target?Math.round(total/target*100):0}%</div></div><div class="card"><div class="label">Falta alcançar</div><div class="value orange">${money(Math.max(target-total,0))}</div></div></div><section class="panel" style="margin-top:16px"><h3>${editingGoalId?'Editar meta':'Nova meta'}</h3><form class="formgrid" onsubmit="saveGoal(event)"><div class="field full"><label>Nome da meta</label><input id="gname" placeholder="Ex.: Reserva de emergência" required></div><div class="field"><label>Objetivo</label><input id="gtarget" type="number" min="0" step="0.01" required></div><div class="field"><label>Valor atual</label><input id="gcurrent" type="number" min="0" step="0.01" value="0" required></div><div class="field"><label>Prazo</label><input id="gdate" type="date"></div><div class="field"><label>Tipo</label><select id="gtype"><option value="saving">Guardar dinheiro</option><option value="debt">Quitar dívida</option><option value="purchase">Compra planejada</option></select></div><div class="formactions"><button type="button" class="btn" onclick="editingGoalId=null;render()">Cancelar</button><button class="btn primary">${editingGoalId?'Salvar meta':'Criar meta'}</button></div></form></section><section class="panel" style="margin-top:16px"><h3>Minhas metas</h3>${db.goals.length?db.goals.map(g=>{let pct=Math.min(Number(g.current)/Number(g.target)*100,100);return `<div class="debtcard"><div class="sectionhead"><div><b>${esc(g.name)}</b><div class="small">${g.date?'Prazo: '+dateBR(g.date):'Sem prazo'} • ${esc(g.type)}</div></div><div class="actions"><button class="btn sm" onclick="editGoal('${g.id}')">Editar</button><button class="btn sm danger" onclick="delGoal('${g.id}')">Excluir</button></div></div><div class="progress"><i style="width:${pct}%"></i></div><div class="debtmeta"><span>${money(g.current)} de ${money(g.target)}</span><span>${Math.round(pct)}%</span></div></div>`}).join(''):'<div class="empty">Nenhuma meta criada.</div>'}</section>`}
function alerts(){let m=ym(cursor),arr=alertData(m);return monthBar()+`<section class="panel"><div class="sectionhead"><div><h2>Central de notificações</h2><div class="small">Alertas calculados a partir do seu mês, orçamentos, dívidas e contas.</div></div><span class="tag">${arr.length} alerta(s)</span></div>${arr.length?arr.map(a=>`<div class="alert ${a.level}"><b>${a.title}</b><div>${a.text}</div></div>`).join(''):'<div class="empty">🎉 Nenhum alerta para este mês.</div>'}</section><section class="panel" style="margin-top:16px"><h3>Regras automáticas</h3><div class="row"><span>Orçamento ≥ 80%</span><b>⚠️ alerta</b></div><div class="row"><span>Orçamento ultrapassado</span><b>🔴 alerta</b></div><div class="row"><span>Conta vence em até 3 dias</span><b>🟡 alerta</b></div><div class="row"><span>Saldo previsto negativo</span><b>🔴 alerta</b></div></section>`}
function saveGoal(e){e.preventDefault();let o={name:gname.value,target:Number(gtarget.value),current:Number(gcurrent.value),date:gdate.value,type:gtype.value};if(editingGoalId){let i=db.goals.findIndex(g=>g.id===editingGoalId);if(i>=0)db.goals[i]={...db.goals[i],...o};editingGoalId=null}else db.goals.push({id:Date.now().toString(),...o});save();render()}
function editGoal(id){let g=db.goals.find(x=>x.id===id);if(!g)return;editingGoalId=id;render();setTimeout(()=>{gname.value=g.name;gtarget.value=g.target;gcurrent.value=g.current;gdate.value=g.date||'';gtype.value=g.type},0)}
function delGoal(id){if(confirm('Excluir esta meta?')){db.goals=db.goals.filter(g=>g.id!==id);save();render()}}
function categoryOptions(type,selected=''){return (categories[type]||[]).map(c=>`<option value="${esc(c)}" ${c===selected?'selected':''}>${esc(c)}</option>`).join('')}
function entries(){let m=ym(cursor),items=allEntries().filter(x=>x.date.startsWith(m)).sort((a,b)=>a.date.localeCompare(b.date));return monthBar()+`<div class="layout"><section class="panel"><h3>${editingId?'Editar lançamento':'Novo lançamento'}</h3><form class="formgrid" onsubmit="submitEntry(event)"><div class="field"><label>Tipo</label><select id="etype" onchange="refreshCategory()"><option value="income">Receita</option><option value="expense">Despesa</option><option value="investment">Investimento</option></select></div><div class="field"><label>Categoria</label><select id="ecat"></select></div><div class="field full"><label>Descrição</label><input id="edesc" placeholder="Ex.: Salário, supermercado, aluguel..." required></div><div class="field"><label>Valor</label><input id="eamount" type="number" step="0.01" min="0" placeholder="0,00" required></div><div class="field"><label>Data</label><input id="edate" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field full"><label>Observação</label><textarea id="enote" placeholder="Opcional"></textarea></div><div class="formactions"><button type="button" class="btn" onclick="cancelEdit()">Limpar</button><button class="btn primary">${editingId?'Salvar alterações':'Adicionar lançamento'}</button></div></form></section><section class="panel"><h3>Calendário financeiro</h3>${calendar(cursor)}</section></div><section class="panel" style="margin-top:16px"><div class="sectionhead"><h3>Lançamentos de ${monthLabel(cursor)}</h3><span class="small">${items.length} item(ns)</span></div>${items.length?items.map(x=>`<div class="row"><div class="rowleft"><b>${dateBR(x.date)} · ${labels[x.type]} · ${esc(x.desc)}</b><span class="tag">${esc(x.category)}</span>${x.note?`<div class="small" style="margin-top:4px">${esc(x.note)}</div>`:''}</div><div style="text-align:right"><b class="${x.type==='income'?'green':x.type==='investment'?'blue':'red'}">${money(x.amount)}</b><div class="actions" style="justify-content:flex-end;margin-top:5px">${x.auto?'<span class="small">automática</span>':`<button class="btn sm" onclick="editEntry('${x.id}')">Editar</button><button class="btn sm danger" onclick="delEntry('${x.id}')">Excluir</button>`}</div></div></div>`).join(''):'<div class="empty">Nenhum lançamento neste mês.</div>'}</section>`}
function calendar(d){let y=d.getFullYear(),mo=d.getMonth(),first=new Date(y,mo,1),days=new Date(y,mo+1,0).getDate(),start=(first.getDay()+6)%7;let cells=[];let prevDays=new Date(y,mo,0).getDate();for(let i=0;i<start;i++)cells.push(`<div class="day mutedday"><div class="daynum">${prevDays-start+i+1}</div></div>`);for(let day=1;day<=days;day++){let date=`${y}-${String(mo+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;let ev=allEntries().filter(x=>x.date===date).slice(0,3);let today=new Date().toISOString().slice(0,10)===date;cells.push(`<div class="day ${today?'today':''}"><div class="daynum">${day}</div>${ev.map(x=>`<div class="event ${x.type==='expense'?'exp':x.type==='investment'?'inv':x.type==='debt'?'debt':''}" title="${esc(x.desc)}">${x.type==='income'?'+':x.type==='investment'?'↗':'−'} ${money(x.amount).replace('R$','').trim()}</div>`).join('')}</div>`)}while(cells.length%7)cells.push('<div class="day mutedday"></div>');return `<div class="calendar">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x=>`<div class="calhead">${x}</div>`).join('')}${cells.join('')}</div>`}
function debts(){return `<div class="layout"><section class="panel"><h3>🔴 Nova dívida inteligente</h3><div class="notice">Cadastre uma vez e o FinFlow cria automaticamente cada parcela no mês correto, do início ao fim.</div><form class="formgrid" onsubmit="addDebt(event)" style="margin-top:12px"><div class="field full"><label>Nome da dívida</label><input id="dname" placeholder="Ex.: Cartão, financiamento, empréstimo" required></div><div class="field"><label>Valor total</label><input id="dtotal" type="number" step="0.01" min="0" required></div><div class="field"><label>Valor da parcela</label><input id="dinst" type="number" step="0.01" min="0" required></div><div class="field"><label>Número de parcelas</label><input id="dqty" type="number" min="1" required></div><div class="field"><label>Primeiro vencimento</label><input id="dstart" type="date" required></div><div class="formactions"><button class="btn primary">Cadastrar dívida</button></div></form></section><section class="panel"><h3>Resumo das dívidas</h3><div class="grid3"><div class="statbox"><div class="small">Ativas</div><div class="big">${db.debts.length}</div></div><div class="statbox"><div class="small">Parcelas/mês atual</div><div class="big red">${money(sums(allEntries().filter(x=>x.date.startsWith(ym(cursor)))).debt)}</div></div><div class="statbox"><div class="small">Total contratado</div><div class="big">${money(db.debts.reduce((a,x)=>a+x.total,0))}</div></div></div></section></div><section class="panel" style="margin-top:16px"><h3>Minhas dívidas</h3>${db.debts.length?db.debts.map(d=>debtCard(d)).join(''):'<div class="empty">Nenhuma dívida cadastrada.</div>'}</section>`}
function debtCard(d){let start=new Date(d.start+'T12:00:00'),end=new Date(d.end+'T12:00:00'),now=new Date();let passed=(now.getFullYear()-start.getFullYear())*12+now.getMonth()-start.getMonth();let paid=Math.min(Math.max(passed+1,0),d.installments),pct=paid/d.installments*100;return `<div class="debtcard"><div class="sectionhead"><div><b>${esc(d.name)}</b><div class="small">${money(d.installment)} × ${d.installments} • total ${money(d.total)}</div></div><button class="btn sm danger" onclick="delDebt('${d.id}')">Excluir</button></div><div class="progress"><i style="width:${pct}%"></i></div><div class="debtmeta"><span>${paid}/${d.installments} parcelas estimadas</span><span>${Math.round(pct)}%</span></div><div class="debtmeta" style="margin-top:7px"><span>Início: ${dateBR(d.start)}</span><span>Fim: ${dateBR(d.end)}</span></div></div>`}
function budgets(){let m=ym(cursor),items=allEntries().filter(x=>x.date.startsWith(m)&&x.type==='expense');let cats=categories.expense;return monthBar()+`<div class="layout"><section class="panel"><h3>Definir orçamento do mês</h3><p class="small">Escolha um limite por categoria. O progresso usa as despesas reais do mês.</p><form class="formgrid" onsubmit="saveBudget(event)"><div class="field"><label>Categoria</label><select id="bcat">${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>Limite mensal</label><input id="blimit" type="number" step="0.01" min="0" placeholder="0,00" required></div><div class="formactions"><button class="btn primary">Salvar orçamento</button></div></form></section><section class="panel"><h3>Resumo</h3><div class="statbox"><div class="small">Despesas no mês</div><div class="big red">${money(items.reduce((a,x)=>a+x.amount,0))}</div></div></section></div><section class="panel" style="margin-top:16px"><h3>Orçamentos de ${monthLabel(cursor)}</h3>${cats.map(c=>{let spent=items.filter(x=>x.category===c).reduce((a,x)=>a+x.amount,0),limit=Number(db.budgets[m+'|'+c]||0);if(!limit&&!spent)return '';let pct=limit?Math.min(spent/limit*100,100):0;return `<div class="budget"><div class="budgettop"><span>${esc(c)}</span><span class="${limit&&spent>limit?'warning':''}">${money(spent)} / ${limit?money(limit):'sem limite'}</span></div><div class="progress"><i style="width:${pct}%;background:${limit&&spent>limit?'var(--red)':'var(--primary)'}"></i></div><div class="small">${limit?(spent>limit?'⚠️ Limite ultrapassado.':Math.round(pct)+'% utilizado.'):'Defina um limite para acompanhar.'} <button class="btn sm" onclick="removeBudget('${esc(c)}')">Remover</button></div></div>`}).join('')||'<div class="empty">Nenhum orçamento configurado.</div>'}</section>`}
function assets(){let total=db.assets.reduce((a,x)=>a+Number(x.amount),0);return `<div class="cards"><div class="card"><div class="label">Patrimônio total</div><div class="value green">${money(total)}</div></div><div class="card"><div class="label">Ativos cadastrados</div><div class="value">${db.assets.length}</div></div></div><div class="layout"><section class="panel"><h3>Novo patrimônio</h3><form class="formgrid" onsubmit="addAsset(event)"><div class="field full"><label>Nome do ativo</label><input id="aname" placeholder="Ex.: Carro, poupança, imóvel, investimento" required></div><div class="field"><label>Tipo</label><select id="atype"><option>Dinheiro</option><option>Investimento</option><option>Veículo</option><option>Imóvel</option><option>Outros bens</option></select></div><div class="field"><label>Valor atual</label><input id="aamount" type="number" step="0.01" min="0" required></div><div class="formactions"><button class="btn primary">Adicionar ativo</button></div></form></section><section class="panel"><h3>Composição do patrimônio</h3>${assetTypes().map(x=>`<div class="barline"><span class="small">${esc(x.t)}</span><div class="track"><div class="fill" style="width:${total?x.v/total*100:0}%"></div></div><b>${money(x.v)}</b></div>`).join('')||'<div class="empty">Adicione seus bens e ativos.</div>'}</section></div><section class="panel" style="margin-top:16px"><h3>Meus ativos</h3>${db.assets.length?db.assets.map(x=>`<div class="row"><div class="rowleft"><b>${esc(x.name)}</b><span class="tag">${esc(x.type)}</span></div><div><b class="green">${money(x.amount)}</b><button class="btn sm danger" onclick="delAsset('${x.id}')">Excluir</button></div></div>`).join(''):'<div class="empty">Nenhum patrimônio cadastrado.</div>'}</section>`}
function assetTypes(){let a={};db.assets.forEach(x=>a[x.type]=(a[x.type]||0)+Number(x.amount));return Object.entries(a).map(([t,v])=>({t,v}))}
function annual(){let y=cursor.getFullYear(),rows=Array.from({length:12},(_,i)=>{let mm=String(i+1).padStart(2,'0'),z=sums(allEntries().filter(x=>x.date.startsWith(y+'-'+mm)));return {m:new Intl.DateTimeFormat('pt-BR',{month:'short'}).format(new Date(y,i,1)).replace('.',''),...z,saldo:z.income-z.expense-z.debt-z.investment}}),tot=sums(allEntries().filter(x=>x.date.startsWith(y+'-'))),max=Math.max(...rows.map(r=>Math.max(r.income,r.expense+r.debt+r.investment)),1);return `<div class="monthbar"><button class="iconbtn" onclick="cursor.setFullYear(cursor.getFullYear()-1);render()">‹</button><div style="text-align:center"><h1>${y}</h1><div class="sub">Visão financeira anual</div></div><button class="iconbtn" onclick="cursor.setFullYear(cursor.getFullYear()+1);render()">›</button></div><div class="yeartotals">${[['Receitas',tot.income,'green'],['Saídas',tot.expense+tot.debt+tot.investment,'red'],['Investimentos',tot.investment,'blue'],['Saldo anual',tot.income-tot.expense-tot.debt-tot.investment,'green']].map(x=>`<div class="statbox"><div class="small">${x[0]}</div><div class="big ${x[2]}">${money(x[1])}</div></div>`).join('')}</div><section class="panel"><h3>Receitas x saídas por mês</h3><div style="display:flex;gap:18px;font-size:11px;color:var(--muted);margin-bottom:8px"><span>■ Receitas</span><span>■ Saídas</span></div>${chartCompare(rows,max)}</section><section class="panel" style="margin-top:16px"><h3>Fechamento mensal</h3><div class="grid3">${rows.map(r=>`<div class="monthbox statbox"><b style="text-transform:capitalize">${r.m}</b><div class="small" style="margin-top:7px">Receitas</div><b class="green">${money(r.income)}</b><div class="small">Saídas</div><b>${money(r.expense+r.debt+r.investment)}</b><div class="small">Saldo</div><b class="${r.saldo>=0?'green':'red'}">${money(r.saldo)}</b></div>`).join('')}</div></section>`}
function chartCompare(rows,max){let w=700,h=205,left=35,bottom=30,top=10,n=rows.length,step=(w-left-10)/n,bw=Math.max(5,step*.28),scale=(h-top-bottom)/max;return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line x1="${left}" y1="${top}" x2="${left}" y2="${h-bottom}" stroke="#e6e8ef"/><line x1="${left}" y1="${h-bottom}" x2="${w}" y2="${h-bottom}" stroke="#e6e8ef"/>${rows.map((r,i)=>{let x=left+i*step+step*.22,a=r.income*scale,b=(r.expense+r.debt+r.investment)*scale;return `<rect x="${x}" y="${h-bottom-a}" width="${bw}" height="${a}" rx="3" fill="currentColor" opacity=".9"><title>${r.m}: receitas ${money(r.income)}</title></rect><rect x="${x+bw+3}" y="${h-bottom-b}" width="${bw}" height="${b}" rx="3" fill="currentColor" opacity=".35"><title>${r.m}: saídas ${money(r.expense+r.debt+r.investment)}</title></rect><text x="${x+bw}" y="${h-9}" text-anchor="middle" font-size="9" fill="currentColor" opacity=".65">${r.m}</text>`}).join('')}</svg>`}
function submitEntry(e){e.preventDefault();let obj={type:etype.value,category:ecat.value,desc:edesc.value,amount:Number(eamount.value),date:edate.value,note:enote.value};if(editingId){let i=db.entries.findIndex(x=>x.id===editingId);if(i>=0)db.entries[i]={...db.entries[i],...obj};editingId=null}else db.entries.push({id:Date.now().toString(),...obj});save();render()}
function refreshCategory(selected=''){let type=document.getElementById('etype')?.value;if(document.getElementById('ecat'))document.getElementById('ecat').innerHTML=categoryOptions(type,selected)}
function editEntry(id){let x=db.entries.find(x=>x.id===id);if(!x)return;editingId=id;view='entries';render();setTimeout(()=>{etype.value=x.type;refreshCategory(x.category);edesc.value=x.desc;eamount.value=x.amount;edate.value=x.date;enote.value=x.note||''},0)}
function cancelEdit(){editingId=null;render()}
function delEntry(id){if(confirm('Excluir este lançamento?')){db.entries=db.entries.filter(x=>x.id!==id);save();render()}}
function addDebt(e){e.preventDefault();let start=dstart.value,s=new Date(start+'T12:00:00'),qty=Number(dqty.value),end=new Date(s);end.setMonth(end.getMonth()+qty-1);db.debts.push({id:Date.now().toString(),name:dname.value,total:Number(dtotal.value),installment:Number(dinst.value),installments:qty,start,end:end.toISOString().slice(0,10)});save();render()}
function delDebt(id){if(confirm('Excluir esta dívida e todas as parcelas futuras?')){db.debts=db.debts.filter(x=>x.id!==id);save();render()}}
function saveBudget(e){e.preventDefault();db.budgets[ym(cursor)+'|'+bcat.value]=Number(blimit.value);save();render()}
function removeBudget(c){delete db.budgets[ym(cursor)+'|'+c];save();render()}
function addAsset(e){e.preventDefault();db.assets.push({id:Date.now().toString(),name:aname.value,type:atype.value,amount:Number(aamount.value)});save();render()}
function delAsset(id){db.assets=db.assets.filter(x=>x.id!==id);save();render()}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='finflow-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function render(){nav();document.getElementById('app').innerHTML=view==='dashboard'?dashboard():view==='entries'?entries():view==='debts'?debts():view==='budgets'?budgets():view==='assets'?assets():view==='goals'?goals():view==='alerts'?alerts():annual();if(view==='entries'&&!editingId)refreshCategory()}
render();
</script>
</body></html>
